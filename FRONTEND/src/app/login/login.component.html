<div class="login-wrapper">
  <div class="left-column">
    <div class="login-container">
      <div class="login-card">
        <div class="welcome-section">
          <h1>Bienvenido de nuevo!</h1>
          <p class="subtitle">Hoy es un nuevo día. Es tu día. Tú le das forma.</p>
          <p class="signin-prompt">Inicia sesión para comenzar a gestionar tus proyectos.</p>
        </div>

        <form class="login-form">
          <div class="form-group">
            <label for="email">Usuario</label>
            <input type="email" id="email" placeholder="Tu usuario" class="form-control">
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Al menos 8 caracteres" class="form-control">
            <a href="#" class="forgot-password">¿Has olvidado tu contraseña?</a>
          </div>

          <button type="submit" class="signin-button">Iniciar sesión</button>

          <div class="signup-prompt">
            ¿No tienes una cuenta? <a href="#" class="signup-link">Inscribirse</a>
          </div>
        </form>
      </div>

      <footer class="login-footer">
        © 2025 RESERVADOS TODOS LOS DERECHOS
      </footer>
    </div>
  </div>

  <div class="right-column">
    <img src="assets/images/login-illustration.png" alt="Login Illustration" class="illustration">
  </div>
</div>
